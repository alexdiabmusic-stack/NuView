name: Release

# Builds, signs and publishes the installer APK. The signing key never lives in the repository:
# it is supplied through repository secrets (see docs/DEPLOYMENT.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub release (otherwise only build and attach the APK as a workflow artifact)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      TVE_KEYSTORE_BASE64: ${{ secrets.TVE_KEYSTORE_BASE64 }}
      TVE_KEYSTORE_PASSWORD: ${{ secrets.TVE_KEYSTORE_PASSWORD }}
      TVE_KEY_ALIAS: ${{ secrets.TVE_KEY_ALIAS }}
      TVE_KEY_PASSWORD: ${{ secrets.TVE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
        with: { add-job-summary: never }

      - name: Require signing material
        run: |
          missing=()
          for v in TVE_KEYSTORE_BASE64 TVE_KEYSTORE_PASSWORD TVE_KEY_ALIAS TVE_KEY_PASSWORD; do [ -n "${!v}" ] || missing+=("$v"); done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. A release APK must be signed with your own key (see docs/DEPLOYMENT.md)."
            exit 1
          fi
          printf '%s' "$TVE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "TVE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew :core:test --console=plain

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify, name and checksum the APK
        id: apk
        run: |
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$SRC" | tee verify.txt | grep -E "Verifies|Verified using|certificate SHA-256"
          grep -q "^Verifies" verify.txt
          VERSION=$("$BT/aapt2" dump badging "$SRC" | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p")
          mkdir -p dist
          cp "$SRC" "dist/TVEssentials-$VERSION.apk"
          cp "$SRC" "dist/TVEssentials.apk"          # stable file name -> permanent .../releases/latest/download/TVEssentials.apk
          ( cd dist && sha256sum TVEssentials-*.apk TVEssentials.apk > SHA256SUMS.txt && cat SHA256SUMS.txt )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### TV Essentials $VERSION"
            echo '```'; grep -E "certificate SHA-256" verify.txt; cat dist/SHA256SUMS.txt; echo '```'
            echo "Permanent download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/TVEssentials.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: tv-essentials-release
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || TAG="v${{ steps.apk.outputs.version }}"
          gh release create "$TAG" dist/* --title "TV Essentials ${{ steps.apk.outputs.version }}" \
            --notes "Signed release build. Verify the file against SHA256SUMS.txt and the signing certificate fingerprint published in the README." \
            || gh release upload "$TAG" dist/* --clobber
