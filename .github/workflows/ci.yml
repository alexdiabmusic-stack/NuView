name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core library tests (JVM)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to publish compact logs to the 'ci-logs' branch
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
        with: { add-job-summary: never }
      - name: Test
        run: ./gradlew :core:test --console=plain 2>&1 | tee build.log
      - name: Publish log
        if: always()
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: .github/scripts/publish-log.sh core build.log
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-test-reports
          path: core/build/reports/tests/test
          retention-days: 7

  android:
    name: Android build (debug APK + lint)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
        with: { add-job-summary: never }
      - name: Build debug APK and run lint
        run: ./gradlew :app:assembleDebug :app:lintDebug --console=plain 2>&1 | tee build.log
      - name: Report APK
        run: |
          ls -la app/build/outputs/apk/debug/
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "### Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(basename "$APK")\` - $(stat -c %s "$APK") bytes - sha256 \`$(sha256sum "$APK" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|minSdkVersion|targetSdkVersion|uses-permission|uses-feature|launchable-activity|leanback-launchable-activity|application-label:|native-code)" | tee badging.txt
          "$BT/apksigner" verify --print-certs "$APK" 2>&1 | grep -E "Verifies|certificate (DN|SHA-256)" | tee -a badging.txt
      - name: Lint summary
        if: always()
        run: |
          python3 - <<'PY' | tee -a build.log
          import json, glob, collections
          for f in glob.glob("app/build/reports/lint-results-debug.sarif"):
              runs = json.load(open(f)).get("runs", [])
              results = [r for run in runs for r in run.get("results", [])]
              c = collections.Counter(r.get("level", "?") for r in results)
              print("LINT SUMMARY:", dict(c))
              for r in results:
                  if r.get("level") in ("error", "warning"):
                      loc = (r.get("locations") or [{}])[0].get("physicalLocation", {})
                      print(" -", r.get("level"), r.get("ruleId"), "|", r["message"]["text"][:140].replace("\n", " "), "|", loc.get("artifactLocation", {}).get("uri", "")[-70:])
          PY
      - name: Publish log
        if: always()
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: .github/scripts/publish-log.sh android build.log badging.txt
      - uses: actions/upload-artifact@v6
        with:
          name: tv-essentials-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

  live-sources:
    name: Live official-source verification
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
        with: { add-job-summary: never }
      - name: Resolve every app from its official source, download the real APKs, verify against the trust policy
        run: ./gradlew :core:test -Ptve.live=true --tests '*LiveSourcesTest*' --console=plain -i 2>&1 | tee build.log
      - name: Publish log
        if: always()
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          grep -E "^\s*LIVE|tests completed|BUILD|FAILED" build.log > live.log || true
          .github/scripts/publish-log.sh live live.log

  emulator:
    name: Emulator E2E (Android TV, live install)
    runs-on: ubuntu-latest
    needs: android
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
        with: { add-job-summary: never }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on-device tests on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/emulator-e2e.sh
      - name: Publish results and screenshots
        if: always()
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: bash .github/scripts/publish-log.sh emulator ci-out/build.log ci-out/shots ci-out/logcat.txt ci-out/results
