name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['.github/workflows/recon.yml', '**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core library tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
      - name: Test
        run: ./gradlew :core:test --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-test-reports
          path: core/build/reports/tests/test
          retention-days: 7

  android:
    name: Android build (debug APK + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK and run lint
        run: ./gradlew :app:assembleDebug :app:lintDebug --console=plain
      - name: Report APK
        run: |
          ls -la app/build/outputs/apk/debug/
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "### Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(basename "$APK")\` — $(stat -c %s "$APK") bytes — sha256 \`$(sha256sum "$APK" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/aapt2 dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|launchable-activity|leanback-launchable-activity|application-label:)" || true
      - uses: actions/upload-artifact@v6
        with:
          name: tv-essentials-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
