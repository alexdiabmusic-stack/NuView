# One-off reconnaissance (round 4): signer continuity across channels/versions, and the
# pre-rotation SmartTube signer (to populate the revocation list). Public APKs are downloaded
# only to read their signing certificates; nothing is executed.
name: recon
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/recon.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Measure signers
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          mkdir -p apks
          measure() { # file label
            echo "### $2"
            "$BT/apksigner" verify --print-certs "$1" 2>&1 | grep -E 'certificate (DN|SHA-256)|DOES NOT|ERROR' | head -6
            "$BT/aapt2" dump badging "$1" 2>/dev/null | grep -E "^package" | cut -c1-140
          }
          echo "== Nuvio: newest prerelease (beta channel) and an old stable-flagged tag"
          gh release download 1.1.0-beta.5 -R NuvioMedia/NuvioTV -p 'app-full-arm64-v8a-release.apk' -D apks --clobber && mv apks/app-full-arm64-v8a-release.apk apks/nuvio_beta5.apk && measure apks/nuvio_beta5.apk "Nuvio 1.1.0-beta.5"
          gh release download 0.9.5-beta -R NuvioMedia/NuvioTV -p 'app-full-arm64-v8a-release.apk' -D apks --clobber && mv apks/app-full-arm64-v8a-release.apk apks/nuvio_095.apk && measure apks/nuvio_095.apk "Nuvio 0.9.5-beta"
          echo; echo "== SmartTube: which old releases still have assets?"
          for tag in 31.94s 31.88 30.19s 29.97 28.99; do
            echo "-- $tag"; gh api "repos/yuliskov/SmartTube/releases/tags/$tag" -q '.assets[]|"   \(.name)\t\(.size)"' 2>&1 | head -6
          done
      - name: Measure an old (pre-rotation) SmartTube build
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          mkdir -p old
          for tag in 31.94s 31.88 30.19s 29.97 28.99 27.99; do
            a="$(gh api "repos/yuliskov/SmartTube/releases/tags/$tag" -q '[.assets[]|select(.name|test("universal|SmartYouTubeTV.*\\.apk$|\\.apk$"))][0].name' 2>/dev/null)"
            [ -z "$a" ] && continue
            echo "### $tag -> $a"
            gh release download "$tag" -R yuliskov/SmartTube -p "$a" -D old --clobber || continue
            "$BT/apksigner" verify --print-certs "old/$a" 2>&1 | grep -E 'certificate (DN|SHA-256)|DOES NOT|ERROR' | head -4
            "$BT/aapt2" dump badging "old/$a" 2>/dev/null | grep -E "^package" | cut -c1-140
            break
          done
